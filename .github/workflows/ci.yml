name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Committed package builds are current
        run: git diff --exit-code -- packages/shared/dist packages/design-tokens/dist
      - name: Lint
        run: pnpm lint
      - name: Translation keys
        run: pnpm --filter @tunisia-survey/mobile i18n:check
      - name: Unit tests
        run: pnpm -r test
      - name: Dashboard build
        run: pnpm --filter @tunisia-survey/dashboard build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrations + SQL behaviour tests on PostGIS
        run: bash supabase/tests/run_sql_behaviour.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
